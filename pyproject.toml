[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semaforo"
version = "0.0.0"
description = "PoC de conteo vehicular y simulación semafórica (TFG)"
authors = [{ name = "Sergio Andrés Cáceres Surnyak" }]
requires-python = "==3.13.*"

[project.optional-dependencies]
# Solo desarrollo (CLAUDE.md §1): pip install -e ".[dev]"
dev = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semaforo = ["esquema.sql"]

# Estilo PEP 8 (CLAUDE.md §4): ruff check src tests
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W"]
