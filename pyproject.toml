[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semaforo"
version = "0.0.0"
description = "PoC de conteo vehicular y simulación semafórica (TFG UNAE)"
authors = [{ name = "Sergio Andrés Cáceres Surnyak" }]
requires-python = "==3.13.*"

[tool.setuptools.packages.find]
where = ["src"]
